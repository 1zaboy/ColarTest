<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1410" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Цветовой тест</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <section class="screen screen-start is-active" id="start-screen">
        <div class="blob blob-a"></div>
        <div class="blob blob-b"></div>
        <div class="blob blob-c"></div>
        <div class="start-card">
          <p class="eyebrow">быстрый турнир</p>
          <h1>Какой цвет тебе ближе?</h1>
          <p class="lede">
            Два цвета на экране — выбирай тот, что откликается. Победители
            встречаются снова, как в сетке чемпионата.
          </p>
          <label class="field">
            <span>Твоё имя</span>
            <input
              id="name-input"
              type="text"
              maxlength="40"
              autocomplete="name"
              placeholder="Например, Алина"
            />
          </label>
          <button class="cta" id="start-button" type="button">Начать</button>
          <p class="hint" id="start-error" hidden></p>
        </div>
      </section>

      <section class="screen screen-test" id="test-screen">
        <header class="hud">
          <div class="hud-step" id="hud-step">1 / 16</div>
          <div class="hud-left" id="hud-left">Осталось 16</div>
        </header>
        <div class="arena" id="arena">
          <button class="swatch" id="swatch-left" type="button" data-choice="1">
            <span class="swatch-num">1</span>
          </button>
          <button class="swatch" id="swatch-right" type="button" data-choice="2">
            <span class="swatch-num">2</span>
          </button>
        </div>
      </section>

      <section class="screen screen-thanks" id="thanks-screen">
        <canvas id="confetti" aria-hidden="true"></canvas>
        <div class="thanks-copy">
          <p class="eyebrow">готово</p>
          <h2 id="thanks-title">Спасибо!</h2>
          <p id="thanks-text">Твои цвета собраны. Это было ярко.</p>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
